name: Deploy Prepared Boltcall Release
run-name: Release ${{ inputs.release_id }} request ${{ inputs.request_id }} manifest ${{ inputs.manifest_hash }}
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Prepared immutable release identity
        required: true
        type: string
      manifest_hash:
        description: SHA256 of the exact reviewed manifest bytes
        required: true
        type: string
      request_id:
        description: Durable Atlas deployment request identity
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: netlify-production-deploy
  cancel-in-progress: false
env:
  RELEASE_ID: ${{ inputs.release_id }}
  MANIFEST_HASH: ${{ inputs.manifest_hash }}
  REQUEST_ID: ${{ inputs.request_id }}
  GH_TOKEN: ${{ github.token }}
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.repository == 'Boltcall/Boltcall'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_url: ${{ steps.inspect.outputs.release_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - id: inspect
        run: node scripts/release-workflow.mjs inspect
  owner-review:
    needs: inspect
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ needs.inspect.outputs.release_url }}
    steps:
      - run: echo 'Owner accepted the exact prepared manifest shown in the inspection summary.'
  deploy:
    needs: [inspect, owner-review]
    if: github.ref == 'refs/heads/main' && github.repository == 'Boltcall/Boltcall'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global netlify-cli@26.2.0
      - name: Revalidate evidence and deploy retained site and functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: NETLIFY_CLI_ROOT="$(npm root --global)/netlify-cli" node scripts/release-workflow.mjs deploy
      - name: Retain Netlify receipt even when smoke checks fail
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: boltcall-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-receipt.json
          if-no-files-found: warn
          retention-days: 90
  owner-verification:
    needs: [inspect, deploy]
    runs-on: ubuntu-latest
    environment:
      name: production-verification
      url: https://boltcall.org
    steps:
      - run: echo 'Owner accepted the product after browser testing. Final runtime verification follows.'
  final-verification:
    needs: [inspect, deploy, owner-verification]
    if: github.ref == 'refs/heads/main' && github.repository == 'Boltcall/Boltcall'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify accepted release against Netlify and public marker
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/release-workflow.mjs verify
      - name: Retain immutable final verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: boltcall-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipt.json
          if-no-files-found: error
          retention-days: 90
