name: Boltcall PR Tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: boltcall-pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Sitemap lastmod comes from git file history; a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build:fast
