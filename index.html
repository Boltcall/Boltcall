<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <!-- Preconnect to critical domains -->
    <link rel="preconnect" href="https://puszjwovldwgitfpsnfm.supabase.co" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/webp" href="/boltcall_small_logo.webp" sizes="32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google Fonts - non-blocking via media="print" trick.
         display=optional: system fallback used permanently if font misses first paint.
         No <link rel="preload"> here — preloading an external stylesheet triggers an
         eager fetch chain (CSS → font files) that audit tools flag as render-blocking. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sora:wght@600;700;800&display=optional" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sora:wght@600;700;800&display=optional" rel="stylesheet" /></noscript>
    <!-- Heebo: Hebrew-optimized font, loaded lazily via JS when lang=he is active -->
    <script>!function(){var h=document.documentElement;if(h.lang==='he'||h.lang.startsWith('he-')){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap';document.head.appendChild(l);}}();</script>
    
    <!-- SEO Meta Tags -->
    <title>Speed-to-Lead Software for Law Firms | Boltcall</title>
    <meta name="description" content="Boltcall is speed-to-lead software for law firms: instant intake response, missed-call recovery, AI qualification, consultation booking, and after-hours capture — so the first firm to respond wins the retainer." />
    <meta name="author" content="Boltcall" />

    <!-- One-time nuke of stale Workbox SW + caches from earlier deploys.
         Bump BC_SW_V when you need to re-run the nuke for all visitors. -->
    <script>(function(){var v='2026-07-27-a';try{if(localStorage.getItem('bc_sw_v')===v)return;if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){var had=rs.length>0;rs.forEach(function(r){r.unregister()});if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}localStorage.setItem('bc_sw_v',v);if(had)location.reload()})}else{localStorage.setItem('bc_sw_v',v)}}catch(e){}})();</script>

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Speed-to-Lead Software for Law Firms | Boltcall" />
    <meta property="og:description" content="Boltcall answers every intake call, replies to every form, and books consultations 24/7 — so the first firm to respond wins the retainer. Speed-to-lead built for law firms." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://boltcall.org/" />
    <meta property="og:image" content="https://boltcall.org/og-image.jpg" />
    <meta property="og:site_name" content="Boltcall" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Speed-to-Lead Software for Law Firms | Boltcall" />
    <meta name="twitter:description" content="Boltcall answers every intake call, replies to every form, and books consultations 24/7 — so the first firm to respond wins the retainer. Speed-to-lead built for law firms." />
    <meta name="twitter:image" content="https://boltcall.org/og-image.jpg" />
    
    <!-- Additional Meta Tags -->
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light only" />

    <!-- PWA iOS Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Boltcall" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="canonical" href="https://boltcall.org/" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Boltcall",
      "url": "https://boltcall.org",
      "inLanguage": "en-US",
      "description": "Speed-to-lead software for law firms. Every intake call answered, every form replied to, every consultation booked — automatically. 24/7 intake response, missed-call recovery, AI qualification, appointment booking, and after-hours capture.",
      "publisher": {
        "@type": "Organization",
        "name": "Boltcall",
        "url": "https://boltcall.org"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://boltcall.org/blog?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- Organization + SoftwareApplication + FAQPage schema previously lived
         here as static blocks emitted on every route. They duplicated
         per-page emissions (Home.tsx, PricingPage.tsx, Layout, etc), so
         every prerendered page carried each @type 2-3× — a schema-spam
         signal per the 2026-08-29 audit. Removed. Per-page components are
         now the single source of truth; pages that don't emit their own
         still get WebPage/BreadcrumbList/Service from route wrappers.
         ponytail: dedup once, do not re-emit at the template layer. -->

    <!-- Critical inline styles: ensures blank page has correct background/font before
         the async CSS bundle loads. Prevents flash of unstyled content on first paint. -->
    <style>
      *,::before,::after{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%}
      body{background:#fff;color:#111827;font-family:'Poppins',ui-sans-serif,system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh}
    </style>

    <!-- Searchable analytics -->
    <script>window.sa=window.sa||function(){(sa.q=sa.q||[]).push(arguments)}</script>
    <script defer
      src="https://searchable-tracker.searchable.workers.dev/s.js"
      data-domain="boltcall.org"
      data-site-token="pst_086619ee47711a00bec6a6ae"
    ></script>

  </head>
  <body>
    <!-- GTM noscript: only rendered if JS is disabled — no consent possible without JS, so we omit analytics here -->
    <!-- (GTM noscript removed — consent-gated analytics require JavaScript) -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Canonical URL updater — runs after body so it never blocks HTML parsing.
         Prerender (Puppeteer) executes this before capturing, so static HTML is correct. -->
    <script>var p=window.location.pathname||'/';var u='https://boltcall.org'+(p==='/'?'/':p.replace(/\/?$/,'/'));document.querySelector('link[rel="canonical"]').href=u;document.querySelector('meta[property="og:url"]').content=u;</script>

    <!-- OpenAI ChatKit — deferred until user interacts or after 5s idle.
         Moved out of <head> so the event-listener setup never parser-blocks. -->
    <script>
      var _ckLoaded=false;
      function _loadChatKit(){if(_ckLoaded)return;_ckLoaded=true;var s=document.createElement('script');s.src='https://cdn.platform.openai.com/deployments/chatkit/chatkit.js';s.async=true;document.head.appendChild(s);}
      ['scroll','click','touchstart','mousemove'].forEach(function(e){document.addEventListener(e,_loadChatKit,{once:true,passive:true});});
      setTimeout(_loadChatKit,5000);
    </script>

    <!-- Analytics: consent-gated. CookieBanner component handles loading after user accepts.
         On returning visits where consent was previously accepted, React's CookieBanner
         calls loadAnalytics() on mount. No analytics fire without explicit consent. -->
  </body>
</html>
