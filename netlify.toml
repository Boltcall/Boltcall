[build]
  publish = "dist"
  command = "npm run build:prerender"

# Security headers — applied to every route. Keep in sync with any CSP
# expectations added by future integrations (Retell embed, PostHog, Stripe).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(self), fullscreen=(self)"
    # Report-only CSP: nothing is blocked yet; violations POST to client-error-report.
    # Allowlist built from what the site loads today (index.html + src/): Searchable
    # tracker, OpenAI ChatKit, Clarity, GTM/GA, Retell chat widget + LiveKit voice,
    # Stripe.js, Google Fonts, Supabase (https + wss), Cal.com embeds.
    # 'unsafe-inline' on script-src covers the inline boot scripts in index.html;
    # tighten to hashes once the report stream is clean. Flip to enforcing by
    # renaming the header to Content-Security-Policy.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://searchable-tracker.searchable.workers.dev https://cdn.platform.openai.com https://www.clarity.ms https://*.clarity.ms https://www.googletagmanager.com https://cdn.retellai.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://puszjwovldwgitfpsnfm.supabase.co wss://puszjwovldwgitfpsnfm.supabase.co https://api.boltcall.org https://api.retellai.com https://*.retellai.com wss://*.retellai.com https://*.livekit.cloud wss://*.livekit.cloud https://searchable-tracker.searchable.workers.dev https://*.clarity.ms https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://api.openai.com https://cdn.platform.openai.com https://api.stripe.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' https://cal.com https://app.cal.com https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://cdn.platform.openai.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; report-uri /.netlify/functions/client-error-report"

# Service worker must not be cached by browser/CDN
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "http://boltcall.org/*"
  to = "https://boltcall.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.boltcall.org/*"
  to = "https://boltcall.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.boltcall.org/*"
  to = "https://boltcall.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://boltcall.netlify.app/*"
  to = "https://boltcall.org/:splat"
  status = 301
  force = true

# SEO: collapse cannibalizing blog duplicates onto stronger survivor pages.
# Both source URLs were "Crawled - currently not indexed" in GSC because they
# near-duplicate the targets. 301 transfers ranking equity to the survivor.
[[redirects]]
  from = "/blog/why-website-speed-is-everything"
  to = "/blog/why-speed-matters/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/why-website-speed-is-everything/"
  to = "/blog/why-speed-matters/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/will-receptionists-be-replaced-by-ai"
  to = "/blog/is-ai-receptionist-worth-it/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/will-receptionists-be-replaced-by-ai/"
  to = "/blog/is-ai-receptionist-worth-it/"
  status = 301
  force = true

# Pretty lead webhook URL: POST /l/{user_id} → lead-webhook function
[[redirects]]
  from = "/l/:userId"
  to = "/.netlify/functions/lead-webhook/:userId"
  status = 200
  force = true

[[redirects]]
  from = "/after-hours-lead-rescue"
  to = "/after-hours-lead-rescue/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/after-hours-lead-rescue/"
  to = "/after-hours-lead-rescue/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/automatic-reviews-agent"
  to = "/automatic-reviews-agent/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/automatic-reviews-agent/"
  to = "/automatic-reviews-agent/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/reminders-agent"
  to = "/reminders-agent/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/reminders-agent/"
  to = "/reminders-agent/index.html"
  status = 200
  force = true

# SPA catch-all. Points at the noindex shell, NOT /index.html: prerendered pages
# are static files that Netlify serves before this rule ever runs, so anything
# reaching here is either a client-only route (dashboard/auth/setup, all
# robots-disallowed) or a URL that does not exist. Serving /index.html here made
# every unmatched URL a byte-identical, indexable homepage clone.
[[redirects]]
  from = "/*"
  to = "/spa-fallback.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_RETELL_PUBLIC_KEY"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."agent-test"]
  timeout = 300

[functions."agent-self-heal"]
  timeout = 300

# create_full chains up to 11 sequential external calls (scrape, LLM prompt-gen,
# Retell agent/LLM create, Cekura register+evaluators, Supabase writes) — can exceed default cap.
[functions."retell-agents"]
  timeout = 300

# Run message dispatcher every 5 minutes to process due scheduled_messages
[functions."message-dispatcher"]
  schedule = "*/5 * * * *"

# Run sequence processor every 5 minutes to advance follow-up enrollments
[functions."sequence-processor"]
  schedule = "*/5 * * * *"

# Run email inbox poller every 3 minutes to fetch new lead emails
[functions."email-inbox-poller"]
  schedule = "*/3 * * * *"

# Send daily lead summary email to all active users at 07:00 UTC (10 AM Israel / 3 AM EST)
[functions."daily-lead-summary"]
  schedule = "0 7 * * *"

[functions."daily-seo-aeo-runner"]
  schedule = "30 6 * * *"
[functions."weekly-seo-aeo-runner"]
  schedule = "45 6 * * 1"
# Auto-deploy: 07:00 daily (after daily-seo-aeo-runner @ 06:30 commits new
# content, before seo-coverage-monitor @ 07:12 audits live). Compares
# origin/main HEAD sha to last-deployed commit_ref; if different, POSTs to
# Netlify build API to trigger a deploy. Closes the loop for a repo with
# no auto-deploy webhook. Requires NETLIFY_AUTH_TOKEN env var.
[functions."content-deploy-trigger"]
  schedule = "0 7 * * *"
# Daily live audit: sitemap freshness + sample /blog/* canonicals.
# Alerts via Telegram when new AEO content isn't reaching Google
# (SPA shell served or sitemap stale).
[functions."seo-coverage-monitor"]
  schedule = "12 7 * * *"

# ─── Agency OS scheduled functions (Phase F — Layer 2 backbone) ─────────────
# Backbone for the n8n workflows. n8n is the orchestration ergonomic; these
# are the load-bearing backups so the OS degrades gracefully if n8n is down.
# Per plan §4 "Failure mode: if n8n goes down, the OS degrades gracefully —
# Netlify scheduled functions are the backup for the time-critical workflows".

# Weekly creative refresh — Mondays 06:00 UTC (Bolt System SKU only).
[functions."agency-cron-monday-creative"]
  schedule = "0 6 * * 1"

# Friday auto-report — every hour from 06:00 to 15:00 UTC on Fridays; the
# function filters per client.timezone to only fan in the 06:00-08:00 local
# window. Dedupe gate via report_sent event presence.
[functions."agency-cron-friday-report"]
  schedule = "0 6-15 * * 5"

# Monthly optimization brief — 1st of every month, 09:00 UTC.
[functions."agency-cron-monthly-optimization"]
  schedule = "0 9 1 * *"

# Daily QA audit — 02:00 UTC (global trough).
[functions."agency-cron-daily-qa-audit"]
  schedule = "0 2 * * *"

# Hourly delivery monitor — kicks the in-process loop in agency-delivery-monitor.
[functions."agency-cron-hourly-monitor"]
  schedule = "@hourly"

# Customer incident notification (Legal Shield Phase 5) — every hour, emails
# a customer when their agent has 3+ technical call failures in the last hour.
[functions."customer-incident-notify"]
  schedule = "@hourly"

# Post-ship critic with auto-revert — every 15 minutes. The window-end check
# is the gate; most ticks see 0–3 candidates.
[functions."agency-post-ship-watcher"]
  schedule = "*/15 * * * *"

# Why-Log backfill — every hour. Generates plain-English explanations for
# warn+ severity events that don't have one yet. Hard daily cap = 1000 events.
[functions."agency-event-why-explanation-backfill"]
  schedule = "@hourly"

# BENCHMARK curator — Sundays 04:00 UTC. Writes scenario proposals to disk;
# NEVER edits BENCHMARK.md directly (human review required).
[functions."agency-cron-benchmark-curation"]
  schedule = "0 4 * * 0"

# Objection miner — Mondays 08:00 UTC. Clusters last week's lost-call
# objections per workspace and files one prompt fix into the approval queue.
[functions."objection-miner"]
  schedule = "0 8 * * 1"

# Shadow monitor — every 4h. Evaluates shadowing prompt versions and
# auto-promotes/reverts. Was documented as "every 4h" but never scheduled;
# without this the shadow FSM silently never resolves.
[functions."retell-shadow-monitor"]
  schedule = "0 */4 * * *"

# Netlify handles /.netlify/functions/* routing automatically — no redirect needed

# Long cache for hashed static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
